[package]
name = "passgen"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
dialoguer = { version = "0.11", features = ["password"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
arboard = "3.4"